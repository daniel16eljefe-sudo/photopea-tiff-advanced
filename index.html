<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exportador TIFF Avanzado</title>
    <style>
        /* TEMA LIBADWAITA (GNOME) - DARK MODE */
        :root {
            --bg-color: #242424;
            --panel-bg: #303030;
            --text-main: #ffffff;
            --text-dim: #9a9a9a;
            --border-color: #454545;
            --accent-color: #3584e4;
            --accent-hover: #4a90d9;
            --btn-bg: #404040;
            --btn-hover: #4d4d4d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 14px;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        /* Estructura del Layout */
        .main-container {
            display: flex;
            gap: 16px;
            flex-grow: 1;
        }

        .left-col { flex: 1; display: flex; flex-direction: column; gap: 16px; }
        .right-col { flex: 1; display: flex; flex-direction: column; gap: 16px; }
        .btn-col { width: 100px; display: flex; flex-direction: column; gap: 10px; }

        /* Cajas de opciones (Group boxes) */
        .group-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            position: relative;
        }

        .group-title {
            position: absolute;
            top: -10px;
            left: 12px;
            background-color: var(--bg-color);
            padding: 0 6px;
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 600;
        }

        /* Controles de formulario (Radios y Checkboxes estilo Adwaita) */
        .radio-group { display: flex; flex-direction: column; gap: 10px; }
        
        label {
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 8px;
        }

        input[type="radio"], input[type="checkbox"] {
            appearance: none;
            background-color: var(--btn-bg);
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.15em;
            height: 1.15em;
            border: 1px solid var(--border-color);
            display: grid;
            place-content: center;
        }

        input[type="radio"] { border-radius: 50%; }
        input[type="checkbox"] { border-radius: 4px; }

        input[type="radio"]::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            border-radius: 50%;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em var(--accent-color);
        }

        input[type="checkbox"]::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em var(--accent-color);
            transform-origin: bottom left;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        input[type="radio"]:checked::before, input[type="checkbox"]:checked::before {
            transform: scale(1);
        }

        input[type="radio"]:focus, input[type="checkbox"]:focus {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        /* Botones */
        button {
            background-color: var(--btn-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--btn-hover); }

        button.primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        button.primary:hover { background-color: var(--accent-hover); }

        /* Espacio para Anuncios */
        .ad-space {
            margin-top: 16px;
            height: 90px; /* Altura típica de banner horizontal */
            background-color: #1a1a1a;
            border: 1px dashed #555;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            text-align: center;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Columna Izquierda -->
        <div class="left-col">
            <div class="group-box">
                <div class="group-title">Image Compression</div>
                <div class="radio-group">
                    <label><input type="radio" name="img_comp" value="NONE"> None</label>
                    <label><input type="radio" name="img_comp" value="TIFFLZW" checked> LZW</label>
                    <label><input type="radio" name="img_comp" value="TIFFZIP"> ZIP</label>
                    <label><input type="radio" name="img_comp" value="JPEG"> JPEG</label>
                </div>
            </div>
            
            <div class="radio-group" style="padding-left: 8px;">
                <label><input type="checkbox" id="img_pyramid"> Save Image Pyramid</label>
                <label><input type="checkbox" id="save_transparency" checked> Save Transparency</label>
            </div>
        </div>

        <!-- Columna Derecha -->
        <div class="right-col">
            <div class="group-box">
                <div class="group-title">Pixel Order</div>
                <div class="radio-group">
                    <label><input type="radio" name="px_order" value="INTERLEAVED" checked> Interleaved (RGBRGB)</label>
                    <label><input type="radio" name="px_order" value="PER_CHANNEL"> Per Channel (RRGGBB)</label>
                </div>
            </div>

            <div class="group-box">
                <div class="group-title">Byte Order</div>
                <div class="radio-group">
                    <label><input type="radio" name="byte_order" value="IBM" checked> IBM PC</label>
                    <label><input type="radio" name="byte_order" value="MACINTOSH"> Macintosh</label>
                </div>
            </div>

            <div class="group-box">
                <div class="group-title">Layer Compression</div>
                <div class="radio-group">
                    <label><input type="radio" name="layer_comp" value="RLE" checked> RLE (faster saves, bigger files)</label>
                    <label><input type="radio" name="layer_comp" value="ZIP"> ZIP (slower saves, smaller files)</label>
                    <label><input type="radio" name="layer_comp" value="DISCARD"> Discard Layers and Save a Copy</label>
                </div>
            </div>
        </div>

        <!-- Columna de Botones -->
        <div class="btn-col">
            <button class="primary" onclick="exportTiff()">OK</button>
            <button onclick="closePlugin()">Cancel</button>
        </div>
    </div>

    <!-- Espacio para el Anuncio -->
    <div class="ad-space">
        <!-- INSERTA AQUÍ TU SCRIPT DE ADSENSE O RED PUBLICITARIA -->
        Espacio Publicitario Reservado<br>(728x90 o similar)
    </div>

    <script>
        // Función para comunicarse con Photopea
        function sendToPhotopea(script) {
            window.parent.postMessage(script, "*");
        }

        // Función principal de exportación
        function exportTiff() {
            // Recopilar valores de la interfaz
            const imgComp = document.querySelector('input[name="img_comp"]:checked').value;
            const byteOrder = document.querySelector('input[name="byte_order"]:checked').value;
            const layerComp = document.querySelector('input[name="layer_comp"]:checked').value;
            const transparency = document.getElementById('save_transparency').checked;
            
            // Construir el script que se ejecutará dentro de Photopea (ExtendScript)
            let script = `
                try {
                    var doc = app.activeDocument;
                    var opts = new TiffSaveOptions();
                    
                    opts.imageCompression = TIFFEncoding.${imgComp};
                    opts.byteOrder = ByteOrder.${byteOrder};
                    opts.transparency = ${transparency};
                    
                    // Manejo de capas
                    if ("${layerComp}" === "DISCARD") {
                        opts.layers = false;
                    } else {
                        opts.layers = true;
                        opts.layerCompression = LayerCompression.${layerComp};
                    }

                    // Forzar diálogo de guardado del navegador
                    var fileName = doc.name.split('.')[0] + ".tif";
                    var file = new File(fileName);
                    doc.saveAs(file, opts, true, Extension.LOWERCASE);
                    
                } catch(e) {
                    alert("Error al exportar: " + e);
                }
            `;

            // Enviar script a Photopea
            sendToPhotopea(script);
        }

        // Cerrar el plugin (aunque en Photopea web a veces se hace clickando fuera)
        function closePlugin() {
             // En Photopea, esto oculta la ventana del plugin si está en modo panel
             sendToPhotopea('app.echoToOE("");'); 
        }
    </script>
</body>
</html>
