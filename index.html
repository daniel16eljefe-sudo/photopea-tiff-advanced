<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exportador TIFF Avanzado</title>
    <style>
        /* TEMA LIBADWAITA (GNOME) - DARK MODE */
        :root {
            --bg-color: #242424;
            --panel-bg: #303030;
            --text-main: #ffffff;
            --text-dim: #9a9a9a;
            --border-color: #454545;
            --accent-color: #3584e4;
            --accent-hover: #4a90d9;
            --btn-bg: #404040;
            --btn-hover: #4d4d4d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 14px;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        .main-container { display: flex; gap: 16px; flex-grow: 1; }
        .left-col, .right-col { flex: 1; display: flex; flex-direction: column; gap: 16px; }
        .btn-col { width: 100px; display: flex; flex-direction: column; gap: 10px; }

        .group-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            position: relative;
        }

        .group-title {
            position: absolute;
            top: -10px;
            left: 12px;
            background-color: var(--bg-color);
            padding: 0 6px;
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 600;
        }

        .radio-group { display: flex; flex-direction: column; gap: 10px; }
        
        label { display: flex; align-items: center; cursor: pointer; gap: 8px; }

        input[type="radio"], input[type="checkbox"] {
            appearance: none;
            background-color: var(--btn-bg);
            margin: 0;
            color: currentColor;
            width: 1.15em;
            height: 1.15em;
            border: 1px solid var(--border-color);
            display: grid;
            place-content: center;
        }
        input[type="radio"] { border-radius: 50%; }
        input[type="checkbox"] { border-radius: 4px; }

        input[type="radio"]::before, input[type="checkbox"]::before {
            content: "";
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em var(--accent-color);
        }
        input[type="radio"]::before { width: 0.65em; height: 0.65em; border-radius: 50%; }
        input[type="checkbox"]::before {
            width: 0.65em; height: 0.65em;
            transform-origin: bottom left;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        input[type="radio"]:checked::before, input[type="checkbox"]:checked::before { transform: scale(1); }

        button {
            background-color: var(--btn-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--btn-hover); }
        button.primary { background-color: var(--accent-color); border-color: var(--accent-color); }
        button.primary:hover { background-color: var(--accent-hover); }

        .ad-space {
            margin-top: 16px;
            height: 90px;
            background-color: #1a1a1a;
            border: 1px dashed #555;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            text-align: center;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Columna Izquierda -->
        <div class="left-col">
            <div class="group-box">
                <div class="group-title">Image Compression</div>
                <div class="radio-group">
                    <label><input type="radio" name="img_comp" value="NONE"> None</label>
                    <label><input type="radio" name="img_comp" value="TIFFLZW" checked> LZW</label>
                    <label><input type="radio" name="img_comp" value="TIFFZIP"> ZIP</label>
                    <label><input type="radio" name="img_comp" value="JPEG"> JPEG</label>
                </div>
            </div>
            
            <div class="radio-group" style="padding-left: 8px;">
                <label><input type="checkbox" id="img_pyramid"> Save Image Pyramid</label>
                <label><input type="checkbox" id="save_transparency" checked> Save Transparency</label>
            </div>
        </div>

        <!-- Columna Derecha -->
        <div class="right-col">
            <div class="group-box">
                <div class="group-title">Pixel Order</div>
                <div class="radio-group">
                    <label><input type="radio" name="px_order" value="INTERLEAVED" checked> Interleaved (RGBRGB)</label>
                    <label><input type="radio" name="px_order" value="PER_CHANNEL"> Per Channel (RRGGBB)</label>
                </div>
            </div>

            <div class="group-box">
                <div class="group-title">Byte Order</div>
                <div class="radio-group">
                    <!-- Valores corregidos para el motor de Photopea -->
                    <label><input type="radio" name="byte_order" value="IBMPC" checked> IBM PC</label>
                    <label><input type="radio" name="byte_order" value="MACOS"> Macintosh</label>
                </div>
            </div>

            <div class="group-box">
                <div class="group-title">Layer Compression</div>
                <div class="radio-group">
                    <label><input type="radio" name="layer_comp" value="RLE" checked> RLE (faster saves, bigger files)</label>
                    <label><input type="radio" name="layer_comp" value="ZIP"> ZIP (slower saves, smaller files)</label>
                    <label><input type="radio" name="layer_comp" value="DISCARD"> Discard Layers and Save a Copy</label>
                </div>
            </div>
        </div>

        <!-- Botones -->
        <div class="btn-col">
            <button class="primary" onclick="exportTiff()">OK</button>
            <button onclick="closePlugin()">Cancel</button>
        </div>
    </div>

    <!-- Espacio para Anuncios -->
    <div class="ad-space">
        Espacio para tu código<br>de AdSense (728x90)
    </div>

    <script>
        function exportTiff() {
            // Protección: Verificar si se está ejecutando en una pestaña suelta o dentro de Photopea
            if (window.parent === window) {
                alert("⚠️ Este plugin debe ejecutarse DENTRO de Photopea. (Ventana > Complementos > Añadir plugin local)");
                return;
            }

            // Capturar las opciones seleccionadas
            const imgComp = document.querySelector('input[name="img_comp"]:checked').value;
            const byteOrder = document.querySelector('input[name="byte_order"]:checked').value;
            const layerComp = document.querySelector('input[name="layer_comp"]:checked').value;
            const transparency = document.getElementById('save_transparency').checked;

            // Script ultra-seguro que se inyectará en Photopea
            let scriptToRun = `
                try {
                    // 1. Validar que haya una imagen abierta
                    if (app.documents.length === 0) {
                        alert("⚠️ Por favor, abre una imagen antes de exportar a TIFF.");
                    } else {
                        var doc = app.activeDocument;
                        var opts = new TiffSaveOptions();
                        
                        // 2. Asignar parámetros
                        opts.imageCompression = TIFFEncoding.${imgComp};
                        opts.byteOrder = ByteOrder.${byteOrder};
                        opts.transparency = ${transparency};
                        opts.alphaChannels = ${transparency};
                        
                        // 3. Manejo de capas
                        if ("${layerComp}" === "DISCARD") {
                            opts.layers = false;
                        } else {
                            opts.layers = true;
                            opts.layerCompression = LayerCompression.${layerComp};
                        }

                        // 4. Limpiar nombre del archivo y forzar descarga
                        var fName = doc.name;
                        var dotIndex = fName.lastIndexOf('.');
                        if(dotIndex > 0) { fName = fName.substring(0, dotIndex); }
                        var file = new File(fName + ".tif");
                        
                        doc.saveAs(file, opts, true, Extension.LOWERCASE);
                    }
                } catch(e) {
                    alert("Error interno al exportar: " + e.message);
                }
            `;

            // Enviar el comando a Photopea
            window.parent.postMessage(scriptToRun, "*");
        }

        function closePlugin() {
             window.parent.postMessage('app.echoToOE("close");', "*"); 
        }
    </script>
</body>
</html>
